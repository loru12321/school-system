name: D1 copy cloud metadata

# One-off migration helper (docs/cloud-metadata-apac-migration.md).
# Deploys a temporary Worker bound to both databases, copies every row with
# bound parameters, verifies each row by SHA-256, then deletes the Worker.
# It never changes the production Worker or wrangler.jsonc.

on:
  workflow_dispatch:
    inputs:
      target_database_id:
        description: "Destination D1 database id (the new APAC database)"
        required: true
      source_database_id:
        description: "Source D1 database id (current school-system-cloud-metadata)"
        required: true
        default: "4ce32844-b42d-45ff-b436-818ffe714a08"
      mode:
        description: "full = copy everything; delta = only rows updated after 'since'"
        required: true
        default: full
        type: choice
        options: [full, delta]
      since:
        description: "ISO timestamp for delta mode, e.g. 2026-11-01T12:00:00Z"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: d1-copy-cloud-metadata
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SOURCE_ID: ${{ inputs.source_database_id }}
      TARGET_ID: ${{ inputs.target_database_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate inputs
        run: |
          uuid='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          [[ "$SOURCE_ID" =~ $uuid ]] || { echo "invalid source id"; exit 1; }
          [[ "$TARGET_ID" =~ $uuid ]] || { echo "invalid target id"; exit 1; }
          [ "$SOURCE_ID" != "$TARGET_ID" ] || { echo "source and target must differ"; exit 1; }

      - name: Write temporary Worker config
        run: |
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "COPY_TOKEN=$token" >> "$GITHUB_ENV"
          cat > scripts/ops/d1-copy/wrangler.generated.jsonc <<JSON
          {
            "name": "school-system-d1-copy",
            "main": "worker.js",
            "compatibility_date": "2026-06-27",
            "workers_dev": true,
            "vars": { "COPY_TOKEN": "$token" },
            "d1_databases": [
              { "binding": "SRC", "database_name": "copy-source", "database_id": "$SOURCE_ID" },
              { "binding": "DST", "database_name": "copy-target", "database_id": "$TARGET_ID" }
            ]
          }
          JSON

      - name: Deploy temporary copy Worker
        run: |
          npx wrangler deploy -c scripts/ops/d1-copy/wrangler.generated.jsonc 2>&1 | tee deploy.log
          url=$(grep -oE 'https://school-system-d1-copy\.[a-z0-9-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "could not find the workers.dev URL"; exit 1; }
          echo "COPY_BASE_URL=$url" >> "$GITHUB_ENV"

      - name: Copy and verify
        run: node scripts/ops/d1-copy/run.mjs "${{ inputs.mode }}" "${{ inputs.since }}"

      - name: Delete temporary copy Worker
        if: always()
        run: npx wrangler delete -c scripts/ops/d1-copy/wrangler.generated.jsonc --force || true
