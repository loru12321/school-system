name: Build Apps Beta

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: build-apps-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Resolve beta release tag
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.tag.outputs.RELEASE_TAG }}
    steps:
      - name: Resolve immutable beta tag
        id: tag
        shell: bash
        run: echo "RELEASE_TAG=beta-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  windows:
    name: Build Windows installer
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve application version
        id: version
        shell: bash
        run: node scripts/resolve-app-version.mjs --channel beta --tag "${{ needs.metadata.outputs.release-tag }}" --sha "$GITHUB_SHA" --run-number "$GITHUB_RUN_NUMBER"
      - name: Install dependencies
        run: npm ci
      - name: Run package contracts
        run: npm run test:release-manifest && npm run test:desktop-package-contract && npm run test:capacitor-package-contract && npm run test:beta-release-workflow
      - name: Build immutable Windows installer
        shell: pwsh
        run: |
          npm pkg set version="${{ steps.version.outputs.APP_VERSION_NAME }}"
          npm run desktop:build
          New-Item -ItemType Directory -Force release-out | Out-Null
          $installer = Get-ChildItem native-builds -Recurse -Filter 'school-system-windows-*.exe' |
            Where-Object { $_.Name -notlike '*.__uninstaller.exe' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced' }
          Copy-Item $installer.FullName "release-out/school-system-windows-${{ needs.metadata.outputs.release-tag }}-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ needs.metadata.outputs.release-tag }}
          path: release-out/*.exe
          if-no-files-found: error

  android:
    name: Build test-signed Android APK
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Resolve application version
        id: version
        run: node scripts/resolve-app-version.mjs --channel beta --tag "${{ needs.metadata.outputs.release-tag }}" --sha "$GITHUB_SHA" --run-number "$GITHUB_RUN_NUMBER"
      - name: Install dependencies
        run: npm ci
      - name: Run package contracts
        run: npm run test:release-manifest && npm run test:desktop-package-contract && npm run test:capacitor-package-contract && npm run test:beta-release-workflow && node scripts/test-android-signing-contract.js
      - name: Restore Android test-signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_FILE }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'ANDROID_TEST_KEYSTORE_FILE secret is required'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-test.keystore"
          echo "ANDROID_TEST_KEYSTORE_FILE=$RUNNER_TEMP/android-test.keystore" >> "$GITHUB_ENV"
      - name: Sync Capacitor and build immutable APK
        env:
          ANDROID_TEST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          ANDROID_TEST_KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
          ANDROID_TEST_KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
        run: |
          npm run mobile:sync
          cd android
          ./gradlew assembleRelease -PappVersionName="${{ steps.version.outputs.APP_VERSION_NAME }}" -PappVersionCode="${{ steps.version.outputs.APP_BUILD_NUMBER }}"
          cd ..
          mkdir -p release-out
          cp android/app/build/outputs/apk/release/app-release.apk "release-out/school-system-android-${{ needs.metadata.outputs.release-tag }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ needs.metadata.outputs.release-tag }}
          path: release-out/*.apk
          if-no-files-found: error

  ios:
    name: Validate iOS simulator build
    needs: metadata
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve application version
        id: version
        run: node scripts/resolve-app-version.mjs --channel beta --tag "${{ needs.metadata.outputs.release-tag }}" --sha "$GITHUB_SHA" --run-number "$GITHUB_RUN_NUMBER"
      - name: Install dependencies
        run: npm ci
      - name: Run package contracts
        run: npm run test:release-manifest && npm run test:desktop-package-contract && npm run test:capacitor-package-contract && npm run test:beta-release-workflow
      - name: Sync and compile unsigned iOS simulator application
        run: |
          npm run ios:sync
          mkdir -p release-out
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="${{ steps.version.outputs.APP_VERSION_NAME }}" CURRENT_PROJECT_VERSION="${{ steps.version.outputs.APP_BUILD_NUMBER }}" build | tee release-out/ios-build.log
          ditto -c -k --keepParent ios/App/App.xcodeproj "release-out/school-system-ios-${{ needs.metadata.outputs.release-tag }}-project.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ needs.metadata.outputs.release-tag }}
          path: release-out/
          if-no-files-found: error

  publish:
    name: Publish beta prerelease
    needs: [metadata, windows, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-${{ needs.metadata.outputs.release-tag }}'
          path: release-assets
          merge-multiple: true
      - name: Generate release manifest and notes
        env:
          RELEASE_CHANNEL: beta
          RELEASE_TAG: ${{ needs.metadata.outputs.release-tag }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          RELEASE_ASSET_DIR: release-assets
          RELEASE_OUTPUT: release-assets/release-manifest.json
          RELEASE_BUILD_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/build-release-manifest.mjs
          {
            echo "# ${RELEASE_TAG}"
            echo
            echo "Source SHA: ${RELEASE_SOURCE_SHA}"
            echo "Build: ${RELEASE_BUILD_URL}"
            echo
            jq -r '.platforms | to_entries[] | "- \(.key): \(.value.status) | \(.value.bytes) bytes | SHA-256 \(.value.sha256 // "n/a") | \(.value.buildUrl)"' release-assets/release-manifest.json
          } > release-assets/release-notes.md
      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release-tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-assets/release-notes.md --prerelease
          else
            gh release create "$RELEASE_TAG" release-assets/* --title "$RELEASE_TAG" --notes-file release-assets/release-notes.md --prerelease --target "$GITHUB_SHA"
          fi
