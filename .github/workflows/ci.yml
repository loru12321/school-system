name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p0-quick:
    name: P0 Quick Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install font build tooling
        run: python -m pip install fonttools brotli

      - name: Verify system Chrome
        run: google-chrome --version

      - name: Run P0 release gate
        env:
          NODE_OPTIONS: --require ./scripts/playwright-system-chromium.cjs
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: npm run check:p0

  release-guards:
    name: Release Guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: p0-quick

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install font build tooling
        run: python -m pip install fonttools brotli

      - name: Build release surface
        run: npm run build

      - name: Run fast release guards
        run: npm run check:release-fast

  browser-smoke:
    name: Browser Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: release-guards

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install font build tooling
        run: python -m pip install fonttools brotli

      - name: Verify system Chrome
        run: google-chrome --version

      - name: Build web package
        run: npm run build

      - name: Run browser smoke checks
        env:
          NODE_OPTIONS: --require ./scripts/playwright-system-chromium.cjs
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: npm run test:calculation-snapshot:local && npm run smoke:layout:local && npm run smoke:report-footnote:local

  root-validate:
    name: Root Validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: browser-smoke

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install font build tooling
        run: python -m pip install fonttools brotli

      - name: Verify system Chrome
        run: google-chrome --version

      - name: Run root validation
        env:
          NODE_OPTIONS: --require ./scripts/playwright-system-chromium.cjs
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: npm run validate
