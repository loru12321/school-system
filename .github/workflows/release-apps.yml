name: Release Apps

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example school-system-v2026.05.20
        required: true
      prerelease:
        description: Mark this release as a prerelease
        required: false
        default: "false"
  push:
    tags:
      - "school-system-v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  publish-app-assets:
    name: Publish APK and Windows assets
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web package
        run: npm run build

      - name: Guard app download links
        run: npm run test:app-download-runtime-hygiene

      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_ASSET_DIR: release-assets
        run: npm run release:prepare-assets

      - name: Upload release asset bundle as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-assets
          path: release-assets/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          PRERELEASE: ${{ inputs.prerelease || 'false' }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-assets/release-notes.md
          else
            args=()
            if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "$RELEASE_TAG" \
              --notes-file release-assets/release-notes.md \
              "${args[@]}"
          fi
