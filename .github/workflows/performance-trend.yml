name: Performance Trend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/performance/**"
      - "README.md"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: performance-trend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record-performance:
    name: Record browser smoke performance
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message || '', '[skip performance]')
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install font build tooling
        run: python -m pip install fonttools brotli

      - name: Build release surface
        run: npm run build

      - name: Run fast release guards
        run: npm run check:release-fast

      - name: Verify system Chrome
        run: google-chrome --version

      - name: Run local smoke and save raw performance sample
        env:
          NODE_OPTIONS: --require ./scripts/playwright-system-chromium.cjs
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
          SMOKE_OUTPUT_PATH: docs/performance/latest-smoke.json
          SMOKE_PERF_STRICT: "true"
        run: npm run smoke:modules:local

      - name: Update trend report
        env:
          PERFORMANCE_SMOKE_JSON: docs/performance/latest-smoke.json
          PERFORMANCE_REPORT_DIR: docs/performance
        run: npm run performance:record

      - name: Check performance thresholds
        run: npm run test:performance-thresholds

      - name: Upload performance report artifact
        uses: actions/upload-artifact@v4
        with:
          name: performance-trend
          path: docs/performance/

      - name: Commit performance trend
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/performance/latest-smoke.json docs/performance/performance-history.json docs/performance/performance-report.md
          if git diff --cached --quiet; then
            echo "No performance trend changes to commit."
          else
            git commit -m "Record performance trend for ${GITHUB_SHA::7}"
            git push
          fi
