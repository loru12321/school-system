<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
    <title>校衡台 · 暂时离线</title>
    <style>
        :root { color-scheme: light; font-family: "Microsoft YaHei", system-ui, sans-serif; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 32px; color: #202534; background: #f6f7fa; }
        main { width: min(620px, 100%); padding: 44px; border: 1px solid #dfe5ec; border-radius: 18px; background: #fff; box-shadow: 0 22px 60px rgba(34, 44, 62, .1); }
        span { color: #d95f7a; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
        h1 { margin: 12px 0 14px; font-size: clamp(30px, 5vw, 46px); }
        p { margin: 0; color: #6f7c91; font-size: 16px; line-height: 1.8; }
        ol { margin: 26px 0 0; padding: 22px 22px 22px 42px; border-top: 1px solid #dfe5ec; color: #4a566a; line-height: 1.9; }
    </style>
</head>
<body>
    <main>
        <span>Offline</span>
        <h1>暂时无法连接校衡台</h1>
        <p>客户端本身已正常启动，但当前无法访问在线工作台。请检查网络或学校网络策略后，重新打开应用。</p>
        <ol>
            <li>确认电脑能够访问互联网。</li>
            <li>如使用校园网，请确认未拦截 schoolsystem.com.cn。</li>
            <li>网络恢复后关闭并重新打开客户端。</li>
        </ol>
    </main>
</body>
</html>
